[project]
name = "trilium_recall"
version = "0.0.0"
description = "trilium-recall engine: hybrid search over Trilium Notes instances"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=3.0.0",
    "httpx>=0.28.1",
    "mcp-login-oauth",
    "numpy>=2.0",
    "onnxruntime>=1.20",
    "pyyaml>=6.0",
    "selectolax>=0.3.21",
    "sentencepiece>=0.2.2",
    "sqlite-vec>=0.1.6",
    "starlette>=0.40",
    "uvicorn>=0.30",
]

[tool.uv]
# Flat modules in app/; install only the dependencies (no build backend needed).
package = false

[tool.uv.sources]
mcp-login-oauth = { git = "https://github.com/Marceltov/mcp-login-oauth", rev = "v0.1.1" }

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
pythonpath = ["app"]
testpaths = ["app/tests"]
asyncio_mode = "auto"
