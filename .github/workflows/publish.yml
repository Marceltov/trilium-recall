name: Publish engine image

# Build the engine image and push it to GHCR as
# ghcr.io/<owner>/trilium-recall. Auth uses the built-in GITHUB_TOKEN.
#
#   branch push (engine/ changed)        -> :<branch>        (a testable image; latest is NOT moved)
#   v* tag push                          -> :1.2.3/:1.2/:1 + :latest, plus a GitHub release
#
# The plugin and the image are versioned together: a v* tag must equal
# .claude-plugin/plugin.json's version (scripts/check-version.sh).

on:
  push:
    branches: ["**"]
    # Path filters are not evaluated for tag pushes, so every v* tag builds.
    paths:
      - "engine/**"
      - ".claude-plugin/plugin.json"
      - ".github/workflows/publish.yml"
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Tag matches plugin.json
        run: scripts/check-version.sh

      # Derived from the repository, not hardcoded, so an account rename can't break the push.
      - name: Set lowercase image name
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Compute tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: engine
          # CT 115 (and most homelab hosts) are amd64; arm64 would double the build for no user.
          platforms: linux/amd64
          push: true
          build-args: APP_VERSION=${{ steps.meta.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Assemble release notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git for-each-ref "refs/tags/$TAG" --format='%(contents)' > notes.md
          [ -s notes.md ] && printf '\n---\n\n' >> notes.md
          cat >> notes.md <<'NOTES'
          ## Engine image

          `ghcr.io/marceltov/trilium-recall:__VERSION__` — deploy it next to Trilium and
          connect Claude Code with the `trilium-recall-setup` skill. Guide:
          https://trilium-recall.marceltov.de/
          NOTES
          sed -i "s|__VERSION__|${TAG#v}|g" notes.md

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" --title "$TAG" --notes-file notes.md --verify-tag
          fi
